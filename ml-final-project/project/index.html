<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Series Forecasting on Weather Data — ML Final Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/lucide@0.395.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 88px; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  /* Theme tokens — overridden in light mode */
  :root {
    --bg: #070b14;
    --bg-elev: #0c1322;
    --bg-card: rgba(18, 26, 44, 0.6);
    --border: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.22);
    --text: #e6edf7;
    --text-muted: #8a96ab;
    --text-dim: #5d6a82;
    --accent: #22d3ee;
    --accent-2: #38bdf8;
    --accent-glow: rgba(34, 211, 238, 0.18);
  }
  html.light {
    --bg: #f6f8fc;
    --bg-elev: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.75);
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.14);
    --text: #0f172a;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --accent: #0891b2;
    --accent-2: #0284c7;
    --accent-glow: rgba(8, 145, 178, 0.12);
  }

  body { background: var(--bg); color: var(--text); }

  /* Subtle grain overlay for depth */
  .grain::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }
  html.light .grain::before { display: none; }

  .glass {
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .card-hover { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
  .card-hover:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
    box-shadow: 0 8px 32px -8px var(--accent-glow);
  }

  /* Recharts overrides */
  .recharts-cartesian-grid line { stroke: var(--border); }
  .recharts-text { fill: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 12px; }
  .recharts-default-tooltip {
    background: var(--bg-elev) !important;
    border: 1px solid var(--border-strong) !important;
    border-radius: 10px !important;
    font-family: 'Inter', sans-serif !important;
  }

  /* Hero waveform animation — pure CSS so it loads before React */
  @keyframes wave-drift {
    0% { transform: translateX(0) scaleY(1); }
    50% { transform: translateX(-40px) scaleY(1.03); }
    100% { transform: translateX(-80px) scaleY(1); }
  }
  .hero-wave path {
    animation: wave-drift 18s ease-in-out infinite;
    transform-origin: center;
  }
  .hero-wave path:nth-child(2) { animation-duration: 24s; animation-direction: reverse; }
  .hero-wave path:nth-child(3) { animation-duration: 30s; }
  .hero-wave path:nth-child(4) { animation-duration: 22s; animation-direction: reverse; }

  /* Animated counter shimmer */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 8px transparent; }
  }
  .pulse-dot { animation: pulse-glow 2.4s ease-in-out infinite; }

  /* Section reveal */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* Gradient text */
  .gradient-text {
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Pipeline connector line */
  .pipeline-line {
    background: linear-gradient(90deg, transparent 0%, var(--border-strong) 50%, transparent 100%);
  }

  /* Trophy shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .winner-shimmer {
    background: linear-gradient(110deg, transparent 30%, var(--accent-glow) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 4s ease-in-out infinite;
  }

  /* Tab underline transition */
  .tab-active::after {
    content: '';
    position: absolute;
    left: 12px; right: 12px; bottom: -1px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Hide scrollbar on horizontal nav scroll */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body class="grain">
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
